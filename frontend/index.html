<!doctype html>
<html lang="fr" data-theme="light" data-atelier-app="mission">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Atelier Mission</title>
    <script>
      // Reprise, une seule fois, de l'ancienne préférence de thème d'Atelier Mission (champ « theme » de
      // localStorage « atelier-mission:ui ») dans la préférence commune de la suite (« atelier:theme »).
      ;(function () {
        try {
          var legacy = localStorage.getItem('atelier-mission:ui')
          if (legacy === null) return
          localStorage.removeItem('atelier-mission:ui')
          if (localStorage.getItem('atelier:theme') !== null || /(?:^|; )atelier_theme=/.test(document.cookie)) return
          var saved = JSON.parse(legacy).state
          var theme = saved && saved.theme
          if (theme === 'light' || theme === 'dark' || theme === 'system') localStorage.setItem('atelier:theme', theme)
        } catch (error) {}
      })()
    </script>
    <!-- atelier-theme : design-system/brand/atelier-theme.js, injecté ici par vite.config.ts (avant l'affichage) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
